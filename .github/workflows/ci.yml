name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.11"
  XDG_CACHE_HOME: ${{ github.workspace }}/.cache
  PYTHONPYCACHEPREFIX: .pycache-ci
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  package-smoke:
    name: package smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Upgrade packaging tools
        run: python -m pip install --upgrade pip setuptools wheel
      - name: Install package
        run: python -m pip install -e ".[test,schema,database,pdf,parquet]"
      - name: Compile source and tests
        run: python -m compileall -q src tests streamlit_app.py
      - name: Import package
        run: python -c "import synth_platform; print(synth_platform.__version__)"
      - name: CLI help
        run: synth-platform --help

  architecture:
    name: architecture contracts
    runs-on: ubuntu-latest
    needs: package-smoke
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Upgrade packaging tools
        run: python -m pip install --upgrade pip setuptools wheel
      - name: Install test dependencies
        run: python -m pip install -e ".[test,schema,database,pdf,parquet]"
      - name: Run architecture and contract tests
        run: pytest tests/contract -q

  unit:
    name: unit tests
    runs-on: ubuntu-latest
    needs: package-smoke
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Upgrade packaging tools
        run: python -m pip install --upgrade pip setuptools wheel
      - name: Install test dependencies
        run: python -m pip install -e ".[test,schema,database,pdf,parquet]"
      - name: Run unit tests
        run: pytest tests/unit -q

  security:
    name: security and privacy guards
    runs-on: ubuntu-latest
    needs: package-smoke
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Upgrade packaging tools
        run: python -m pip install --upgrade pip setuptools wheel
      - name: Install test dependencies
        run: python -m pip install -e ".[test,schema,database,pdf,parquet]"
      - name: Run security tests
        run: pytest tests/security -q

  integration-light:
    name: integration light
    runs-on: ubuntu-latest
    needs: [architecture, unit, security]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Upgrade packaging tools
        run: python -m pip install --upgrade pip setuptools wheel
      - name: Install integration dependencies
        run: python -m pip install -e ".[test,schema,database,pdf,parquet]"
      - name: Run database and document lifecycle integrations
        run: >
          pytest tests/integration/database_pdf
          --ignore=tests/integration/database_pdf/test_docling_pdf_pipeline.py
          -q
      - name: Run focused cross-lifecycle integrations
        run: >
          pytest
          tests/integration/test_conditional_generation.py
          tests/integration/test_document_extraction.py
          tests/integration/test_relational_generation.py
          tests/integration/test_two_source_directive.py
          -q

  integration-heavy:
    name: integration heavy
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    needs: package-smoke
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Upgrade packaging tools
        run: python -m pip install --upgrade pip setuptools wheel
      - name: Install heavy integration dependencies
        run: python -m pip install -e ".[test,ui,schema,database,pdf,parquet,docling,ocr,llm]"
      - name: Run heavy integration and e2e tests
        run: >
          pytest
          tests/integration/schema
          tests/integration/database_pdf/test_docling_pdf_pipeline.py
          tests/e2e
          -q
