name: ci

on:
  pull_request:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "22"
  UV_SYSTEM_PYTHON: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  XDG_CACHE_HOME: ${{ github.workspace }}/.cache
  PYTHONPYCACHEPREFIX: .pycache-ci

jobs:
  backend-tests:
    name: backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install backend dependencies
        run: uv sync --extra test --extra api --extra schema --extra parquet

      - name: Run backend tests
        run: uv run --extra test --extra api --extra schema --extra parquet pytest

  frontend-tests-build:
    name: frontend tests and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install frontend dependencies
        working-directory: web
        run: npm ci

      - name: Run frontend tests
        working-directory: web
        run: npm test -- --run

      - name: Build frontend
        working-directory: web
        run: npm run build

  docker-build:
    name: backend docker image
    runs-on: ubuntu-latest
    needs:
      - backend-tests
      - frontend-tests-build
    steps:
      - uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -t synthetic-data-twin-api:ci -t synthetic-data-twin-api:${{ github.sha }} .

      - name: Smoke test backend image
        run: |
          docker run --rm -d --name synthetic-data-twin-api-ci -p 8000:8000 synthetic-data-twin-api:ci
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:8000/api/health; then
              docker stop synthetic-data-twin-api-ci
              exit 0
            fi
            sleep 1
          done
          docker logs synthetic-data-twin-api-ci
          docker stop synthetic-data-twin-api-ci
          exit 1
