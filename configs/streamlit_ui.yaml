app:
  page_title: Synthetic Data Twin Platform
  page_icon: ":material/data_object:"
  layout: wide
  intro: One synthetic-data platform - multiple SSOT input workflows
  nav:
    Platform:
      - key: home
        file: home.py
        title: Home
        icon: ":material/home:"
        default: true
    Create:
      - key: schema
        file: schema_twin.py
        title: Schema Mode
        icon: ":material/schema:"
      - key: database
        file: database_twin.py
        title: Database Twin
        icon: ":material/database:"
      - key: pdf
        file: pdf_twin.py
        title: PDF Twin
        icon: ":material/description:"
      - key: transcript
        file: transcript_twin.py
        title: Customer Interactions Twin
        icon: ":material/support_agent:"

production:
  profiles:
    production_aliases:
      - prod
      - production
      - client
    known:
      - development
      - demo
      - staging
      - prod
      - production
      - client
  statuses:
    ready: ready
    unavailable: work_in_progress
  checks:
    unknown_profile_remediation: Use SP_DEPLOYMENT_PROFILE=development, staging, demo, or production.
    mock_generation_remediation: Unset SP_NEMO_DATA_DESIGNER_MOCK before client use.
    local_slm_remediation: Use an internal hosted OpenAI-compatible endpoint, or set SP_PRODUCTION_ALLOW_LOCAL_SLM=1 for a controlled on-box deployment.
    remote_api_key_remediation: Set the configured SLM API key environment variable.
    data_designer_remediation: Install the data-designer package in the deployment environment.
    wip_mode_remediation: Keep it visibly marked as work-in-progress or set available_in_production=true only after validation.
    not_ready_mode_remediation: Set production_status=ready only after client validation is complete.

quality_signals:
  schema_caption: Schema mode has no source records, so validation focuses on requested counts, constraints, PK uniqueness, and FK integrity.
  database_caption: Compares synthetic preview stats to the profiled source shape (null rate / distinctness). Not a full statistical audit.
  pdf_caption: For documents, field match / accuracy against generated ground truth is the quality signal (layout structure preserved, values replaced).
  schema_integrity_doc: Schema-only generation has no source baseline; integrity is the quality signal.

home:
  title: Synthetic Data Twin Platform
  chooser_heading: What would you like to create?
  chooser_copy: One platform. Multiple SSOT input paths. Pick the source type you have.
  chat:
    heading: Platform chat
    welcome: Tell me what synthetic data you want to create, and I will route it to the right twin workflow.
    input_placeholder: Describe the schema, database, PDF, or customer interaction you want to twin.
    accept_file: multiple
    file_types:
      - sql
      - csv
      - db
      - sqlite
      - sqlite3
      - pdf
      - txt
      - log
    submit_mode: disable
    quick_prompt_label: Start with
    mode_selector_label: Mode
    all_modes_heading: All modes
    production_hold_message: This workflow is marked work-in-progress for client production runs.
    customizations_heading: Configured options
    customization_name_column: Option
    customization_value_column: Default
    customization_scope_column: Scope
    file_only_message: Attached file
    quick_prompts:
      - label: Draft schema
        prompt: Create an ecommerce dataset with customers, orders, order items, products, payments, and shipments.
      - label: Twin database
        prompt: Train a portable synthetic twin from a SQLite customer database.
      - label: Twin PDF
        prompt: Create a synthetic copy of this PDF with safe replacement values.
      - label: Twin transcript
        prompt: Create synthetic customer support conversations from this transcript.
    modes:
      - key: schema
        title: Schema Mode
        body: Create relational synthetic data from a prompt or SQL schema.
        caption: Prompt or DDL -> draft/review schema -> generate rows -> validate -> download
        page: schema_twin.py
        link_label: Open Schema Mode
        icon: ":material/schema:"
        primary_action: Review the drafted schema, then generate validated CSV tables.
        assistant_summary: Use this when the source of truth is a schema, DDL, or natural-language dataset request.
        production_status: ready
        available_in_production: true
        status_label: Production ready
        keywords:
          - schema
          - ddl
          - sql
          - table
          - tables
          - columns
          - ecommerce
          - dataset
          - .sql
        customizations:
          - label: Intent
            default: Development & testing
            scope: Run metadata
          - label: Locale
            default: en_US
            scope: Synthetic values
          - label: Rows per table
            default: "100"
            scope: Output volume
          - label: Generation backend
            default: NeMo Data Designer + local SLM
            scope: Rows
      - key: database
        title: Database Twin
        body: Train a portable ML twin from an existing SQLite database.
        caption: Connect -> profile -> train artifact -> disconnect -> generate -> validate -> export
        page: database_twin.py
        link_label: Open Database Twin
        icon: ":material/database:"
        primary_action: Connect a SQLite source or generated sample, then train the portable twin.
        assistant_summary: Use this when the source of truth is an existing database and distribution fidelity matters.
        production_status: ready
        available_in_production: true
        status_label: Production ready
        keywords:
          - database
          - sqlite
          - db
          - train
          - profile
          - copula
          - distribution
          - .db
          - .sqlite
        customizations:
          - label: Source
            default: Generated sample or SQLite upload
            scope: Input
          - label: Model type
            default: Standard ML twin
            scope: Training
          - label: Category weights
            default: Learned from source
            scope: Distribution
          - label: Chunk size
            default: "10000"
            scope: Large generation
      - key: pdf
        title: PDF Twin
        body: Create synthetic documents while preserving useful PDF structure.
        caption: Upload -> extract/template -> bind fields -> generate values -> render -> validate
        page: pdf_twin.py
        link_label: Open PDF Twin
        icon: ":material/description:"
        primary_action: Upload a PDF and inspect the extracted bindings before value generation.
        assistant_summary: Use this when the source of truth is a PDF. This mode is WIP for NeMo fit; layout stays platform-native.
        production_status: work_in_progress
        available_in_production: false
        status_label: Work in progress
        keywords:
          - pdf
          - document
          - form
          - statement
          - invoice
          - ocr
          - scanned
          - .pdf
        customizations:
          - label: Intent
            default: Document testing
            scope: Run metadata
          - label: Extraction engine
            default: Advanced document extraction
            scope: Understanding
          - label: Value backend
            default: Experimental NeMo value generation
            scope: Synthetic values
          - label: Render validation
            default: Enabled
            scope: Quality
      - key: transcript
        title: Customer Interactions Twin
        body: Create synthetic customer conversations from a sanitized interaction contract.
        caption: Paste/upload -> sanitize -> build SSOT -> generate interaction -> validate -> download
        page: transcript_twin.py
        link_label: Open Customer Interactions Twin
        icon: ":material/support_agent:"
        primary_action: Add a transcript, build the contract, then generate a source-free synthetic interaction.
        assistant_summary: Use this when the source of truth is a support chat, call transcript, or log.
        production_status: ready
        available_in_production: true
        status_label: Production ready
        keywords:
          - transcript
          - conversation
          - interaction
          - support
          - chat
          - call
          - log
          - .txt
          - .log
        customizations:
          - label: Synthetic turns
            default: "5"
            scope: Output volume
          - label: SSOT mode
            default: NeMo Data Designer structured SSOT
            scope: Contract
          - label: Raw source retention
            default: "No"
            scope: Privacy
          - label: Validation
            default: Non-replay checks
            scope: Quality
  workflows:
    - key: schema
      title: Schema Mode
      body: Create synthetic data from structure alone.
      caption: SQL DDL -> review -> set row counts -> generate -> validate -> download
      page: schema_twin.py
      link_label: Open Schema Mode
      icon: ":material/schema:"
    - key: database
      title: Database Twin
      body: Train a portable ML twin from an existing database.
      caption: Connect -> profile -> train ML twin -> disconnect -> generate -> validate -> export
      page: database_twin.py
      link_label: Open Database Twin
      icon: ":material/database:"
    - key: pdf
      title: PDF Twin
      body: Create synthetic documents while preserving useful document structure.
      caption: Upload -> understand -> generate -> validate -> download
      page: pdf_twin.py
      link_label: Open PDF Twin
      icon: ":material/description:"
    - key: transcript
      title: Customer Interactions Twin
      body: Create synthetic customer conversations from real interaction examples.
      caption: Paste/upload -> preview -> build twin -> create interactions -> validate
      page: transcript_twin.py
      link_label: Open Customer Interactions Twin
      icon: ":material/support_agent:"
  controls_heading: Shared platform controls
  controls:
    - label: SSOT paths
      value: "4"
    - label: Output volume
      value: user-controlled
    - label: Validation
      value: common evidence
    - label: Privacy
      value: tested safeguards
  technical_details: >
    Shared stages behind every input path: discovery, understanding, canonical
    contract, entity/dependency representation, generation, validation, and
    export. Database Mode adds visible ML model training evidence; Schema and
    Database modes expose requested output-volume controls; Customer
    Interactions Twin uses sanitized preview plus hash-based non-replay
    validation.

schema:
  title: Schema Mode
  caption: You have the structure of the data you need - generate synthetic relational data without production records.
  default_intent: Development & testing
  intent_options:
    - Development & testing
    - QA / automated tests
    - Demonstrations
    - Data pipeline development
    - Early project environments
  intent_presets:
    Development & testing:
      rows_per_table: 100
      locale: en_US
      prefer_llm_text: false
      caption: Balanced row counts for local development.
    QA / automated tests:
      rows_per_table: 50
      locale: en_US
      prefer_llm_text: false
      caption: Smaller, fast suites for automated QA.
    Demonstrations:
      rows_per_table: 200
      locale: en_US
      prefer_llm_text: false
      caption: Larger samples for guided evaluations.
    Data pipeline development:
      rows_per_table: 500
      locale: en_US
      prefer_llm_text: false
      caption: Higher volume for pipeline soak tests.
    Early project environments:
      rows_per_table: 100
      locale: en_US
      prefer_llm_text: false
      caption: Starter volumes for new environments.
  locale_options:
    - en_US
    - en_GB
    - en_IN
    - de_DE
    - fr_FR
  export_formats:
    - csv
    - parquet
  steps:
    intent:
      title: Intent
      what: Records the business purpose for this run. It does not change policy or generation unless a configured backend policy says so.
      next: Upload a schema file.
    provide_schema:
      title: Provide schema
      what: Upload SQL DDL containing CREATE TABLE statements, fields, keys, defaults, constraints, and explicit PK/FK relationships.
      next: Review the detected structure.
    review_schema:
      title: Review schema
      help: Confirm tables, keys, and relationships before generating.
      what: This is the parsed structure the twin will follow.
      next: Configure table counts and seed.
    configure_generation:
      title: Configure generation
      what: Choose how much data to create and how to reproduce it.
      next: Generate.
    generate:
      title: Generate
      what: Create the synthetic relational dataset from the schema.
      next: Preview and validate.
    preview:
      title: Preview
      caption: Your synthetic dataset is ready to preview.
    validate:
      title: Validate
    download:
      title: Download

database:
  title: Database Twin
  caption: Learn from an existing database, download a portable trained twin, disconnect the source, then generate and validate synthetic data from the artifact alone.
  default_intent: Development & testing
  intent_options:
    - Development & testing
    - QA / automated tests
    - Demonstrations
    - Analytics prototyping
    - Safe sharing with partners
  intent_presets:
    Development & testing:
      preferred_model_type: safe_gaussian_copula
      dp_epsilon: 1.0
      sample_entity_default: 400
      locale: en_US
      caption: Fidelity-focused twin for engineering work.
    QA / automated tests:
      preferred_model_type: safe_gaussian_copula
      dp_epsilon: 1.0
      sample_entity_default: 200
      locale: en_US
      caption: Faster sample database defaults for QA loops.
    Demonstrations:
      preferred_model_type: safe_gaussian_copula
      dp_epsilon: 1.0
      sample_entity_default: 600
      locale: en_US
      caption: Richer sample defaults for guided evaluations.
    Analytics prototyping:
      preferred_model_type: safe_gaussian_copula
      dp_epsilon: 1.0
      sample_entity_default: 800
      locale: en_US
      caption: Larger samples for analytics sketches.
    Safe sharing with partners:
      preferred_model_type: dp_gaussian_copula
      dp_epsilon: 1.0
      sample_entity_default: 400
      locale: en_US
      caption: Prefer differential privacy when sharing externally.
  source_options:
    - Use a generated sample database
    - Upload a SQLite file
  model_type_labels:
    safe_gaussian_copula: Standard ML twin
    dp_gaussian_copula: ML twin with differential privacy
    sdv_gaussian_copula: SDV Gaussian copula
  steps:
    intent:
      title: Intent
      what: Records the business purpose for this run. It does not change policy or generation unless a configured backend policy says so.
      next: Connect a SQLite source database.
    connect:
      title: Connect
      what: Provide a SQLite database to learn from (upload or generate a sample).
      next: Discover tables and relationships.
    discover:
      title: Discover
      what: Inspect tables, columns, primary keys, and foreign keys.
      next: Understand values and meaning.
    profile:
      title: Understand values
      what: Learn safe shape statistics (missingness, cardinality, distributions).
      next: Approve how each column should be treated.
    understand:
      title: Understand data
      what: Review column meanings, then approve the understanding used for training.
      next: Train the twin.
    train:
      title: Train twin
      what: Train or retrain a portable ML twin from the approved database understanding.
      next: Download the trained twin artifact.
    download_twin:
      title: Download trained twin
      what: Package the trained twin as a portable artifact you can move without the source.
      next: Disconnect the source database.
    disconnect:
      title: Disconnect source
      what: Stop using the source so generation runs from the trained twin only.
      next: Generate synthetic data from the artifact.
    generate:
      title: Generate
      what: Create synthetic tables from the portable artifact. Tune category mixes if needed.
      next: Validate integrity and quality.
    validate:
      title: Validate
      what: Confirm relational integrity and available quality signals.
      next: Export the synthetic database.
    export:
      title: Export
      what: Write the synthetic database and download it.
      next: Done - you have a validated synthetic database.

pdf:
  title: PDF Twin
  caption: Upload a document and create a synthetic view that preserves useful document structure. Fields are replaced with generated values.
  default_intent: Document testing
  default_extraction_engine: Advanced document extraction
  intent_options:
    - Document testing
    - QA / automation
    - Demonstrations
    - Privacy-safe sharing
  intent_presets:
    Document testing:
      locale: en_US
      prefer_llm_narrative: false
      caption: Deterministic local values for test documents.
    QA / automation:
      locale: en_US
      prefer_llm_narrative: false
      caption: Stable seeds and locale for automation.
    Demonstrations:
      locale: en_US
      prefer_llm_narrative: false
      caption: Readable synthetic documents for guided evaluations.
    Privacy-safe sharing:
      locale: en_US
      prefer_llm_narrative: false
      caption: Privacy-first defaults; LLM narrative stays off unless enabled.
  extraction_options:
    - Advanced document extraction
    - Automatic (native/OCR)
  steps:
    intent:
      title: Intent
      what: Records the business purpose for this run. It does not change policy or generation unless a configured backend policy says so.
      next: Upload a PDF.
    upload:
      title: Upload
      what: Provide the source PDF to twin.
      next: Discover document structure.
    discover:
      title: Discover document
      what: Process the PDF so the platform can understand its structure.
      next: Build the twin template.
    template:
      title: Build twin template
      what: Capture structure and labels for the twin (sensitive values stay redacted).
      next: Understand fields, then generate values.
    redacted:
      what: Download a redacted copy without generating a synthetic twin.
    understand:
      title: Understand fields
      what: Map labels to semantic roles and entity paths so generation can stay realistic and consistent.
      next: Generate synthetic values.
    generate:
      title: Generate synthetic values
      what: Create AI-generated replacement values matched to each field's meaning. Shared entity/database values should be used when provided.
      next: Build and download the twin PDF.
    render_validate:
      title: Build twin document and validate
      what: Render the synthetic PDF, then check field match and layout fit.
      next: Download the twin when validation looks good.

