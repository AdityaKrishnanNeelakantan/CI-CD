  title: Customer Interactions Twin
  caption: Create synthetic customer interactions from a real conversation example.
  labels:
    source_type: customer interaction
    source_type_metric: Source type
    source_text_kept_metric: Source text kept
    synthetic_section: Synthetic interaction
    synthetic_status_metric: Status
    synthetic_turns_metric: Turns
    source_speakers_metric: Source speakers
    issue_type_prefix: "Issue type:"
    grounding_topics_prefix: "Grounding topics:"
    structured_evidence_expander: Structured SSOT evidence
    technical_json_expander: Technical JSON
    build_button: Build twin contract
    generate_button: Generate synthetic interaction
    validate_button: Validate synthetic interaction
    start_new_button: Start new interaction
    interaction_file_label: Interaction file
    paste_label: Or paste the interaction
    locked_input_help: Start a new interaction to replace this source.
    synthetic_turns_input: Synthetic turns
    validation_metric: Synthetic interaction
    validation_details_expander: Validation details
    twin_status_metric: Twin status
    validation_status_metric: Validation
    turns_checked_metric: Turns checked
    raw_source_retained_metric: Raw source retained
    raw_source_included_metric: Raw source included
    passed_message: Passed. The synthetic interaction is source-free.
    review_message: Needs review. Check the synthetic interaction before downloading.
    zip_contents_expander: What's included in the ZIP
    validation_evidence_expander: Validation evidence
    download_button: Download customer interactions twin (ZIP)
    zip_caption: The ZIP does not include the raw source interaction.
    zip_contents: Structured twin JSON, twin contract, validation report, and README.
    source_free_privacy: Generated from sanitized contract only; raw source text is not included.
    contract_not_generated: Structured twin was not generated by the SDK path.
    speakers_preview_suffix: Direct identifiers and common sensitive references are hidden in the preview.
  artifact:
    file_name: customer_interactions_twin_artifact.zip
    readme_title: Customer Interactions Twin artifact
    readme_body: Contains the twin contract, synthetic interaction transcript, structured SSOT evidence, and validation evidence. Raw source interaction text is not included.
  sample_loader:
    enabled: false
    data_dir: data
    label: Sample interaction
    button_label: Load sample interaction
  steps:
    add:
      title: Add customer interaction
      what: Upload a TXT/LOG file or paste a customer conversation.
      next: Review the safe preview.
    preview:
      title: Preview
    contract:
      title: Build twin contract
      what: Turn the interaction into a reusable twin contract. Raw interaction text is dropped after this step.
      next: Create synthetic customer interactions.
    generate:
      title: Create customer conversation
      what: Choose how many messages you want in the new conversation.
      next: Check the conversation before downloading.
    validate:
      title: Validate interaction
      what: Check that the synthetic interaction does not replay the source.
      next: Download the finished twin.
    download:
      title: Download twin
      what: Review the generated twin, then download it as a ZIP.
      next: Done.
