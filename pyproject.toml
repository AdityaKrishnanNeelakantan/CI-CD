[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "synth-platform"
version = "3.0.0"
description = "Unified synthetic-data intelligence platform for schema, database, and document twin workflows"
requires-python = ">=3.11"
readme = "README.md"
authors = [
  { name = "Synth Platform Contributors" }
]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11"
]
dependencies = [
  "pydantic>=2",
  "pandas>=2.0",
  "numpy>=1.23",
  "safetensors>=0.4",
  "SQLAlchemy>=2.0",
  "cryptography>=41",
  "pdfplumber>=0.11",
  "pypdf>=5",
  "reportlab>=4",
  "PyYAML>=6.0",
  "Faker>=20"
]

[project.optional-dependencies]
api = [
  "fastapi>=0.110",
  "uvicorn>=0.29"
]
database = [
  "sdv>=1.37.4",
  "copulas>=0.12"
]
docling = [
  "docling==2.119.0"
]
jobs = [
  "celery>=5.3"
]
llm = [
  "anthropic>=0.25.0",
  "groq>=0.4.0",
  "openai>=1.0.0"
]
ocr = [
  "pdf2image>=1.17",
  "Pillow>=10",
  "pytesseract>=0.3"
]
parquet = [
  "pyarrow>=12"
]
pdf = [
  "fpdf2>=2.8.7",
  "langdetect>=1.0.9"
]
schema = [
  "duckdb>=0.9",
  "scipy>=1.10",
  "simpleeval>=1.0.7"
]
test = [
  "pytest>=7"
]
ui = [
  "streamlit==1.60.0"
]

[project.scripts]
synth-platform = "synth_platform.interfaces.cli.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
synth_platform = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "contract: cross-module API and architecture contracts",
  "e2e: end-to-end workflow and UI tests",
  "integration: multi-component tests that may need heavier dependencies",
  "negative: invalid-input and defensive behavior tests",
  "smoke: lightweight application smoke tests",
  "unit: focused unit tests"
]
